name: A股放量上涨日报

on:
  schedule:
    - cron: '35 7 * * 1-5'   # 每交易日 15:35 北京时间
    - cron: '40 14 * * *'    # 临时测试触发（验证 schedule 是否生效）
  workflow_dispatch: {}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests pandas markdown
      - name: 生成并发送日报
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python report.py
