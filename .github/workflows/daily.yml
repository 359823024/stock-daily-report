name: A股放量上涨日报

on:
  schedule:
    - cron: '35 7 * * 1-5'   # 每交易日 15:35 北京时间（GitHub 调度不可靠，主用外部定时器触发）
  workflow_dispatch: {}       # 外部定时器通过 API 调用此入口

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests pandas markdown
      - name: 生成并发送日报
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python report.py
